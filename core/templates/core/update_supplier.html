{% extends 'core/base.html' %}
{% block title %}Update Supplier{% endblock %}
{% block page_name %}Update Supplier{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-header bg-warning text-dark font-weight-bold">
                <i class="fa-solid fa-pen-to-square"></i> Edit Supplier: {{ supplier.company_name }}
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-warning w-50">Update</button>
                        <a href="{% url 'suppliers' %}" class="btn btn-secondary w-50">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
