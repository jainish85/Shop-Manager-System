<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopManager | Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background-color: #f4f6f8;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #334155; padding: 20px;
        }
        .auth-container { width: 100%; max-width: 420px; }
        .brand-header {
            text-align: center; margin-bottom: 30px; color: #1e1e2d;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 28px; font-weight: 700;
        }
        .brand-header svg { width: 28px; height: 28px; fill: currentColor; }
        .form-card {
            background-color: #ffffff; padding: 40px; border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .form-title { font-size: 20px; font-weight: 600; margin-bottom: 24px; color: #1e293b; text-align: center; }
        
        /* Styling the Django Form Fields */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 5px; color: #475569; font-weight: 500; }
        .form-group input { 
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;
        }
        .helptext { font-size: 11px; color: #64748b; display: block; margin-top: 4px; }
        .errorlist { color: #b91c1c; font-size: 13px; list-style: none; margin-bottom: 10px; }

        .btn-submit {
            width: 100%; padding: 12px; background-color: #2563eb; color: #ffffff;
            border: none; border-radius: 6px; font-size: 15px; font-weight: 500;
            cursor: pointer; margin-top: 15px;
        }
        .btn-submit:hover { background-color: #1d4ed8; }
        .form-footer { text-align: center; font-size: 14px; margin-top: 24px; color: #64748b; }
        .form-footer a { color: #2563eb; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-header">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm2 4h12v10H6zm3 2v6h6v-6h-6zM3 4h18v2H3z"/></svg>
            ShopManager
        </div>

        <div class="form-card">
            <h2 class="form-title">Create your account</h2>
            
            <form method="post">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="form-group">
                        <label>{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                            <small class="helptext">{{ field.help_text|safe }}</small>
                        {% endif %}
                        {% for error in field.errors %}
                            <p class="errorlist">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn-submit">Register</button>

                <div class="form-footer">
                    <p>Already have an account? <a href="{% url 'login' %}">Log In</a></p>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
